<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
             user-scalable=no, viewport-fit=cover"
  />
  <title>MedCare | Clinical System</title>

  <!-- ── Fonts ─────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ── Tailwind (browser build — swap for CLI build in production) ──── -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

  <!-- ── HTML5 QR Code Scanner ─────────────────────────────────────────── -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <!-- ── PeerJS (Distributed Knowledge Mesh) ───────────────────────────── -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- ── QRCode.js (Google Lens Deep Linking) ───────────────────────────── -->
  <script src="./lib/qrcode.min.js"></script>

  <script>
    const basePath = window.location.hostname === 'harsha-e.github.io' ? '/Medical-PWA-v2' : '';
    
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = (basePath || '.') + '/style.css';
    document.head.appendChild(link);

    const scrollbarLink = document.createElement('link');
    scrollbarLink.rel = 'stylesheet';
    scrollbarLink.href = (basePath || '.') + '/scrollbar.css';
    document.head.appendChild(scrollbarLink);

    const tourLink = document.createElement('link');
    tourLink.rel = 'stylesheet';
    tourLink.href = (basePath || '.') + '/tours/tour-styles.css';
    document.head.appendChild(tourLink);
  </script>

  <!-- ── PWA manifest ──────────────────────────────────────────────────── -->
  <link rel="icon" type="image/jpeg" id="favicon-link" />
  <link rel="manifest" id="manifest-link" />
  <meta name="theme-color" content="#1a0a12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf7f4" media="(prefers-color-scheme: light)">
  <script>
    const BASE_PATH = window.location.hostname === 'harsha-e.github.io' ? '/Medical-PWA-v2' : '';
    document.getElementById('favicon-link').href = `${BASE_PATH}/assets/logo.webp`;
    document.getElementById('manifest-link').href = window.location.hostname === 'harsha-e.github.io' ? `${BASE_PATH}/manifest.github.json` : '/manifest.local.json';

    // Catch beforeinstallprompt early to avoid race conditions with module loading
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredInstallPrompt = e;
    });
  </script>

  <!--
    ── Firebase config ────────────────────────────────────────────────────
    Injected here (not inside JS) so the API key is not embedded in
    source files tracked by git.

    In production: have your server template-render the real values.
    In local dev:  fill in your project's config from the Firebase console.

    firebase.js reads this tag via document.getElementById('firebase-config').
  -->
  <script id="firebase-config" type="application/json">
    {
      "apiKey":            "REPLACE_WITH_YOUR_API_KEY",
      "authDomain":        "REPLACE_WITH_YOUR_AUTH_DOMAIN",
      "projectId":         "REPLACE_WITH_YOUR_PROJECT_ID",
      "storageBucket":     "REPLACE_WITH_YOUR_STORAGE_BUCKET",
      "messagingSenderId": "REPLACE_WITH_YOUR_SENDER_ID",
      "appId":             "REPLACE_WITH_YOUR_APP_ID"
    }
  </script>
  

</head>

<body class="text-gray-100 overflow-hidden w-screen h-screen selection:bg-[#7f2f5d] selection:text-white" style="background-color: var(--color-surface);">

  <!-- ── Global Animated Blobs ─────────────────────────────────────────── -->
  <style>
    @keyframes premium-blob-flow {
      0% { transform: translate3d(0px, 0px, 0) scale(1) rotate(0deg); }
      33% { transform: translate3d(30px, -50px, 0) scale(1.2) rotate(10deg); }
      66% { transform: translate3d(-20px, 20px, 0) scale(0.8) rotate(-10deg); }
      100% { transform: translate3d(0px, 0px, 0) scale(1) rotate(0deg); }
    }
    .animate-blob {
      animation: premium-blob-flow 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
      backface-visibility: hidden;
    }
    .animation-delay-2000 { animation-delay: -5s; }
    .animation-delay-4000 { animation-delay: -10s; }
  </style>
  <div id="blob-bg" class="fixed inset-0 z-0 pointer-events-none overflow-hidden transition-colors duration-700" style="background-color: var(--color-surface);">
      <!-- Lava Blob 1 (Top Left Edge) -->
      <div class="animate-blob absolute top-[-30%] left-[-30%] w-[60vw] h-[60vw] md:w-[40vw] md:h-[40vw] rounded-full filter blur-[100px] opacity-20 md:opacity-20" style="background-color: var(--color-primary);"></div>
      
      <!-- Lava Blob 2 (Top Right Edge) -->
      <div class="animate-blob animation-delay-2000 absolute top-[-20%] right-[-30%] w-[60vw] h-[60vw] md:w-[35vw] md:h-[35vw] rounded-full filter blur-[120px] opacity-20 md:opacity-20" style="background-color: var(--color-primary);"></div>
      
      <!-- Lava Blob 3 (Bottom Edge) -->
      <div class="animate-blob animation-delay-4000 absolute bottom-[-40%] left-[20%] w-[60vw] h-[60vw] md:w-[45vw] md:h-[45vw] rounded-full filter blur-[100px] opacity-20 md:opacity-20" style="background-color: var(--color-primary);"></div>
  </div>

  <!-- ── Splash screen ─────────────────────────────────────────────────── -->
  <!--
    Shown immediately while JS loads. app.js / splash.js is responsible
    for fading this out once the app is ready. It is intentionally
    plain HTML so it appears before any script executes.
  -->
  <style>
    @keyframes splash-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .anim-spin-slow {
      animation: splash-spin 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .anim-spin-fast-reverse {
      animation: splash-spin 2s linear infinite reverse;
    }
  </style>
  <div
    id="splash-screen"
    class="fixed inset-0 z-[9999] flex flex-col items-center justify-center transition-opacity duration-1000 bg-surface text-text-primary"
    style="background-color: var(--color-surface)"
  >
    <!-- Outer Neumorphic Dish -->
    <div class="relative w-40 h-40 flex items-center justify-center rounded-full bg-surface-deep shadow-[10px_10px_30px_rgba(0,0,0,0.8),-10px_-10px_30px_rgba(255,255,255,0.05),inset_5px_5px_15px_rgba(0,0,0,0.5),inset_-5px_-5px_15px_rgba(255,255,255,0.02)] border border-white/5 mb-10 overflow-hidden before:absolute before:inset-0 before:rounded-full before:bg-gradient-to-br before:from-transparent before:to-black/30">
      
      <!-- Spinning Glowing Track -->
      <div class="absolute w-32 h-32 rounded-full border border-transparent anim-spin-slow opacity-80" style="border-top-color: var(--color-accent-primary); border-left-color: var(--color-secondary); box-shadow: inset 0 4px 20px rgba(16,185,129,0.2);"></div>
      <div class="absolute w-28 h-28 rounded-full border border-transparent anim-spin-fast-reverse opacity-60" style="border-bottom-color: var(--color-accent-bright); border-right-color: var(--color-primary);"></div>
      
      <!-- Inner Glass Core -->
      <div class="relative w-24 h-24 rounded-full bg-surface/50 backdrop-blur-xl shadow-[0_10px_30px_rgba(0,0,0,0.8),inset_2px_2px_5px_rgba(255,255,255,0.1)] border border-white/10 flex items-center justify-center animate-pulse">
        <svg class="w-10 h-10 text-accent-bright" style="filter: drop-shadow(0 0 10px var(--color-accent-bright));" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
        </svg>
      </div>
    </div>
    
    <!-- Text Elements -->
    <div class="flex flex-col items-center gap-2">
      <h1 class="font-bold text-lg tracking-[0.3em] uppercase text-text-primary drop-shadow-md">Med<span class="text-accent-primary">Check</span></h1>
      <p class="font-mono text-[10px] tracking-[0.5em] animate-pulse uppercase text-accent-bright" style="text-shadow: 0 0 12px rgba(16,185,129,0.8);">
        Initializing Core...
      </p>
    </div>
  </div>

  <!-- ── App viewport ──────────────────────────────────────────────────── -->
  <!--
    Router mounts each view's DOM here.
    Starts opacity-0; splash.js fades it in after boot.
  -->
  <main
    id="app-viewport"
    class="relative z-10 w-full h-[100dvh] max-h-[100dvh] opacity-0 transition-opacity duration-1000 grid"
  ></main>

  <!-- ── Navigation root ───────────────────────────────────────────────── -->
  <!-- GlassNavbar mounts itself here so it always sits above the viewport -->
  <div id="header-root"></div>
  <div id="navigation-root" class="fixed z-[9000]"></div>

  <!-- ── Global Theme Toggle removed and moved to Settings ───────────────────────────────────────────── -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script type="module">
    import { pipeline, env, AutoModel, AutoProcessor, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers';
    window.transformers = { pipeline, env, AutoModel, AutoProcessor, RawImage };
  </script>
  <!-- ── Entry point ───────────────────────────────────────────────────── -->
  <script>
    const script = document.createElement('script');
    script.type = 'module';
    script.src = (window.location.hostname === 'harsha-e.github.io' ? '/Medical-PWA-v2' : '.') + '/app.js';
    document.body.appendChild(script);
  </script>

</body>
</html>
