<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0407;
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        a.widget-container {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            height: 100%;
            padding: 16px;
            box-sizing: border-box;
            border-radius: 24px;
            background: #0a0407;
            border: 2px solid #7f2f5d; /* Burgundy border */
            box-shadow: 
                6px 6px 12px rgba(0,0,0,0.8), 
                -4px -4px 10px rgba(255,255,255,0.04),
                inset 1px 1px 2px rgba(255,255,255,0.05);
        }
        .qr-container {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 12px;
            padding: 4px;
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* In a real implementation this src will be replaced by WidgetPublisher/ServiceWorker with a valid base64 data URI */
        }
        .qr-placeholder {
            width: 100%;
            height: 100%;
            background-color: #eee;
        }
        .info-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }
        .header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #7f2f5d;
            font-weight: 900;
        }
        .data-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .data-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .data-value {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .blood-type {
            color: #ffb88c;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <a href="medcheck://emergency" class="widget-container">
        <div class="qr-container">
            <!-- If qrData exists, render img, else fallback to a placeholder -->
            <img src="{{qrData}}" alt="SOS QR" onerror="this.style.display='none'">
        </div>
        
        <div class="info-col">
            <div class="header">MEDICAL ID</div>
            
            <div class="data-group">
                <div class="data-label">Blood Type</div>
                <div class="data-value blood-type">{{bloodGroup}}</div>
            </div>
            
            <div class="data-group">
                <div class="data-label">Allergies</div>
                <div class="data-value">{{criticalAllergies}}</div>
            </div>
        </div>
    </a>
</body>
</html>
